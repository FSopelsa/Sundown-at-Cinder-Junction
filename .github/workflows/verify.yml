name: Verify

on:
  push:
    branches:
      - main
      - "prel/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Both  ends of the supported range in package.json "engines":
        # "^20.1                                                                                                     9.0 || >=22.12.0". Quoted so YAML keeps them as strings.
        node-version: ["20", "22"]

    name: test-and-build (Node ${{ matrix.node-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run check
